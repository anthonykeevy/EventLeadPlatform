# Decomposition Patterns - Ralf Taskflow Memory
# This file stores learned patterns for effective task decomposition
# Updated by Ralf as patterns emerge from story decomposition sessions
# Version: 1.0.0
# Last Updated: 2026-01-11

patterns:

  # Pattern 1: Vertical Slice
  vertical_slice:
    name: "Vertical Slice Decomposition"
    description: "Break story by user-facing features, each task delivers end-to-end slice"
    when_to_use:
      - "Story has multiple independent features"
      - "Features can be tested in isolation"
      - "UI + API + DB changes are tightly coupled per feature"
    structure:
      - "T01: Feature A (UI + API + DB)"
      - "T02: Feature B (UI + API + DB)"
      - "T03: Integration/polish"
    benefits:
      - "Each task is independently testable"
      - "Early feedback on complete features"
      - "Reduces integration risk"
    risks:
      - "May duplicate some setup across tasks"
    example: "STORY-3.8: Split by form component types"

  # Pattern 2: Foundation First
  foundation_first:
    name: "Foundation First Decomposition"
    description: "Build shared infrastructure first, then features that depend on it"
    when_to_use:
      - "Story requires new shared components"
      - "Multiple features depend on same foundation"
      - "Foundation is independently testable"
    structure:
      - "T01: Foundation/infrastructure (models, base components)"
      - "T02: Feature A (uses foundation)"
      - "T03: Feature B (uses foundation)"
    benefits:
      - "Clear dependencies"
      - "Foundation gets thorough testing"
      - "Features can be parallelized after T01"
    risks:
      - "T01 failure blocks all subsequent tasks"
      - "Foundation may need refinement after feature feedback"

  # Pattern 3: Test-Driven Split
  test_driven_split:
    name: "Test-Driven Task Split"
    description: "Each task is designed around a specific test suite"
    when_to_use:
      - "Story has complex validation logic"
      - "Multiple edge cases to handle"
      - "Strong testing requirements"
    structure:
      - "T01: Happy path implementation + tests"
      - "T02: Error handling + edge case tests"
      - "T03: Integration tests + cleanup"
    benefits:
      - "Test coverage is explicit per task"
      - "Easy to verify task completion"
      - "Encourages test-first development"

  # Pattern 4: API-First
  api_first:
    name: "API-First Decomposition"
    description: "Build and test API before UI"
    when_to_use:
      - "API contract is well-defined"
      - "Multiple consumers (web, mobile, etc.)"
      - "Backend complexity exceeds frontend"
    structure:
      - "T01: API endpoints + API tests"
      - "T02: Frontend integration"
      - "T03: End-to-end tests"

  # Pattern 5: Migration Safety
  migration_safety:
    name: "Migration Safety Pattern"
    description: "For stories involving data/schema changes"
    when_to_use:
      - "Database migrations required"
      - "Existing data must be preserved"
      - "Rollback capability needed"
    structure:
      - "T01: Migration script + rollback + tests (no app changes)"
      - "T02: Application code to use new schema"
      - "T03: Cleanup (remove old code paths if any)"
    critical_rules:
      - "NEVER combine migration with app code in same task"
      - "Migration task must include rollback verification"

# High-leverage decomposition heuristics
heuristics:
  
  max_task_size:
    rule: "No task should take more than 2-3 hours of focused work"
    rationale: "Larger tasks risk context loss in isolated sessions"
    
  one_test_file_per_task:
    rule: "Each task should produce tests in at most 2 test files"
    rationale: "More files suggests scope creep"
    
  forbidden_zone_clarity:
    rule: "Forbidden zones should be directory-level, not file-level, when possible"
    rationale: "Easier to verify compliance"
    
  ac_count:
    rule: "Each task should have 2-5 acceptance criteria"
    rationale: "Fewer = too vague, more = too complex"

# Learned from project experience
project_specific:
  eventlead_patterns:
    - pattern: "Form builder tasks split by component archetype"
      learned_from: "STORY-3.x series"
    - pattern: "Always separate styling tasks from functionality tasks"
      learned_from: "UAT churn on combined tasks"
