# Dev Patterns - Ralf Taskflow Memory
# Recurring implementation patterns that work well in this codebase
# Updated by ralf-dev as patterns emerge from task execution
# Version: 1.0.0
# Last Updated: 2026-01-11

patterns:

  # Pattern 1: React Component Implementation
  react_component:
    name: "React Component Implementation"
    description: "Standard pattern for implementing new React components"
    when_to_use:
      - "Task requires new UI component"
      - "Task modifies existing component behavior"
    steps:
      - "1. Create component file with props interface"
      - "2. Implement minimal render logic"
      - "3. Add to index.ts exports"
      - "4. Create unit test file"
      - "5. Test in isolation before integration"
    files_typically_touched:
      - "src/components/{name}/{name}.tsx"
      - "src/components/{name}/index.ts"
      - "src/components/{name}/{name}.test.tsx"
    verification:
      - "Component renders without errors"
      - "Props are typed correctly"
      - "Tests pass"

  # Pattern 2: API Endpoint Implementation
  api_endpoint:
    name: "FastAPI Endpoint Implementation"
    description: "Standard pattern for new API endpoints"
    when_to_use:
      - "Task requires new backend endpoint"
      - "Task modifies API behavior"
    steps:
      - "1. Add route to router file"
      - "2. Create/update Pydantic schemas"
      - "3. Implement service logic"
      - "4. Add unit tests"
      - "5. Test with manual curl/Postman"
    files_typically_touched:
      - "backend/modules/{module}/router.py"
      - "backend/modules/{module}/schemas.py"
      - "backend/modules/{module}/service.py"
      - "backend/tests/test_{module}.py"
    verification:
      - "Endpoint responds correctly to valid input"
      - "Endpoint rejects invalid input with 400/422"
      - "Auth is enforced (if required)"

  # Pattern 3: Form Builder Component
  form_builder_component:
    name: "Form Builder Component"
    description: "Pattern for adding new form builder components"
    when_to_use:
      - "Task adds new field type to form builder"
      - "Task modifies form component rendering"
    steps:
      - "1. Create field component in fields/"
      - "2. Register in ComponentRegistry"
      - "3. Add properties section if needed"
      - "4. Update type definitions"
      - "5. Test in canvas and preview"
    files_typically_touched:
      - "frontend/src/features/builder/components/fields/{Field}.tsx"
      - "frontend/src/features/builder/registry/ComponentRegistry.tsx"
      - "frontend/src/features/builder/types/builder.types.ts"
    verification:
      - "Component appears in sidebar"
      - "Component renders in canvas"
      - "Properties update correctly"

  # Pattern 4: Database Migration
  database_migration:
    name: "Database Migration"
    description: "Safe pattern for database schema changes"
    when_to_use:
      - "Task requires new table or column"
      - "Task modifies database schema"
    steps:
      - "1. Create migration with alembic revision"
      - "2. Implement upgrade() and downgrade()"
      - "3. Update SQLAlchemy model"
      - "4. Run migration on dev database"
      - "5. Verify with SELECT query"
    files_typically_touched:
      - "backend/migrations/versions/{revision}_*.py"
      - "backend/models/{model}.py"
    verification:
      - "Migration runs without error"
      - "Rollback works correctly"
      - "Model queries work"
    warnings:
      - "NEVER run alembic commands directly - instruct user"
      - "Always test rollback"

  # Pattern 5: Test-First Addition
  test_first:
    name: "Test-First Implementation"
    description: "Write test before implementation"
    when_to_use:
      - "AC requires specific behavior"
      - "Logic is complex or error-prone"
    steps:
      - "1. Write failing test that verifies AC"
      - "2. Run test to confirm it fails for right reason"
      - "3. Implement minimal code to pass"
      - "4. Refactor if needed"
      - "5. Verify test still passes"
    benefits:
      - "Clear success criteria"
      - "Regression protection"
      - "Faster debugging"

# Codebase-specific conventions
conventions:
  
  naming:
    components: "PascalCase (e.g., SubmitButton)"
    files: "PascalCase.tsx for components, camelCase.ts for utils"
    tests: "{name}.test.tsx or test_{name}.py"
    
  imports:
    frontend: "Use absolute imports from src/"
    backend: "Use relative imports within module"
    
  error_handling:
    frontend: "Use React error boundaries for components"
    backend: "Use HTTPException with appropriate status codes"

# High-value shortcuts
shortcuts:
  
  quick_test:
    frontend: "npm test -- --grep '{pattern}' --watch"
    backend: "pytest -xvs backend/tests/ -k '{pattern}'"
    
  quick_lint:
    frontend: "npm run lint -- --fix"
    backend: "ruff check --fix ."
    
  quick_build:
    frontend: "npm run build"
    backend: "python -c 'from backend.main import app'"
