# High-Leverage Tests - Ralf Taskflow Memory
# Tests that repeatedly catch bugs early - prioritize these patterns
# Version: 1.0.0
# Last Updated: 2026-01-11

high_leverage_tests:

  # Category: Form Builder (EventLead specific)
  form_builder:
    
    component_render_test:
      name: "Component Render Smoke Test"
      description: "Verify component renders without crash for all states"
      pattern: |
        test('ComponentX renders in all states', () => {
          // Empty state
          render(<ComponentX value={undefined} />);
          // Filled state
          render(<ComponentX value="test" />);
          // Error state
          render(<ComponentX value="test" error="Error msg" />);
          // Disabled state
          render(<ComponentX value="test" disabled />);
        });
      catches:
        - "Null pointer on undefined props"
        - "Missing conditional renders"
        - "State initialization bugs"
      priority: "Always include for new components"

    properties_sync_test:
      name: "Properties Panel Sync Test"
      description: "Verify property changes update component and persist"
      pattern: |
        test('Property X syncs correctly', async () => {
          // Select component
          // Change property in panel
          // Verify component reflects change
          // Save and reload
          // Verify persistence
        });
      catches:
        - "One-way binding bugs"
        - "State sync issues between panel and component"
        - "Persistence failures"
      priority: "Always include for property panel features"

  # Category: API Endpoints
  api:
    
    auth_boundary_test:
      name: "Authentication Boundary Test"
      description: "Verify endpoint rejects unauthenticated requests"
      pattern: |
        test('Endpoint requires auth', async () => {
          const response = await request(app)
            .post('/api/v1/endpoint')
            .send(validPayload);
          expect(response.status).toBe(401);
        });
      catches:
        - "Missing auth middleware"
        - "Auth bypass bugs"
      priority: "Always include for protected endpoints"

    validation_test:
      name: "Input Validation Test"
      description: "Verify endpoint validates required fields"
      pattern: |
        test.each([
          [{}, 'missing required field'],
          [{ field: null }, 'null value'],
          [{ field: '' }, 'empty string'],
          [{ field: 'x'.repeat(1000) }, 'too long'],
        ])('rejects invalid input: %s', async (payload, case) => {
          const response = await request(app)
            .post('/api/v1/endpoint')
            .send(payload);
          expect(response.status).toBe(400);
        });
      catches:
        - "Missing validation"
        - "Injection vulnerabilities"
        - "Buffer overflow potential"
      priority: "Always include for POST/PUT endpoints"

  # Category: Database Operations
  database:
    
    rollback_test:
      name: "Transaction Rollback Test"
      description: "Verify failed operations don't leave partial data"
      pattern: |
        test('Rollback on failure', async () => {
          // Count before
          // Trigger operation that fails midway
          // Count after
          // Verify counts match
        });
      catches:
        - "Partial writes"
        - "Orphaned records"
        - "Transaction handling bugs"
      priority: "Include for multi-step database operations"

  # Category: Integration
  integration:
    
    happy_path_e2e:
      name: "Happy Path End-to-End"
      description: "Complete user flow from start to finish"
      pattern: |
        test('User can complete full workflow', async () => {
          // Start at entry point
          // Complete each step
          // Verify final state
          // Verify side effects (emails, logs, etc.)
        });
      catches:
        - "Flow breaks between steps"
        - "Missing redirects"
        - "State not passing correctly"
      priority: "Include as final integration task"

# Test selection guidance
test_selection:
  
  rules:
    - "Every task must include at least one high-leverage test pattern"
    - "New components: Always include component_render_test"
    - "New endpoints: Always include auth_boundary_test + validation_test"
    - "Database changes: Always include rollback_test"
    - "Final task: Always include happy_path_e2e"
    
  anti_patterns:
    - "Tests that only check happy path"
    - "Tests that depend on external services without mocks"
    - "Tests that take more than 5 seconds to run"
    - "Tests with non-deterministic timing"
