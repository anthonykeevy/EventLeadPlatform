# Retro Patterns - Ralf Taskflow Memory
# Recurring root causes and prevention actions from retrospectives
# Append-only: Add new patterns after each retro
# Version: 1.0.0
# Last Updated: 2026-01-11

root_cause_patterns:

  # Pattern 1: Ambiguous Acceptance Criteria
  ambiguous_ac:
    name: "Ambiguous Acceptance Criteria"
    symptoms:
      - "Different interpretations during dev and UAT"
      - "UAT failure on 'works correctly' type AC"
      - "Scope debate during execution"
    root_cause: "AC uses vague terms without measurable outcomes"
    prevention:
      - "ralf-sm: Use specific, measurable language in ACs"
      - "ralf-sm: Include verification method with each AC"
      - "ralf-dev: Clarify before implementing, not after"
    example:
      bad: "Form works correctly"
      good: "Form submits successfully and shows 'Saved' confirmation within 2s"
    frequency: 0
    last_seen: null

  # Pattern 2: Missing Edge Case
  missing_edge_case:
    name: "Edge Case Not Specified"
    symptoms:
      - "Happy path passes, edge case fails UAT"
      - "Tester finds case not covered by any AC"
    root_cause: "AC only covers happy path"
    prevention:
      - "ralf-sm: Include at least 2 edge cases per AC"
      - "ralf-dev: Write negative tests before positive"
      - "ralf-uat: Always include negative test section"
    frequency: 0
    last_seen: null

  # Pattern 3: Integration Assumption
  integration_assumption:
    name: "Assumed Integration Would Work"
    symptoms:
      - "Unit tests pass, integration fails"
      - "Works in isolation, fails in context"
    root_cause: "No integration test specified or run"
    prevention:
      - "ralf-sm: Specify integration tests in Task Spec"
      - "ralf-dev: Run full build before completion"
      - "Add integration test to CI"
    frequency: 0
    last_seen: null

  # Pattern 4: Scope Creep During UAT
  uat_scope_creep:
    name: "Scope Creep Disguised as Defect"
    symptoms:
      - "UAT fails on feature not in any AC"
      - "Tester says 'it should also do X'"
    root_cause: "Unclear scope boundaries in Task Spec"
    prevention:
      - "ralf-sm: Explicit Scope (Out) section in Task Spec"
      - "ralf-uat: Run scope-check before marking as defect"
    frequency: 0
    last_seen: null

  # Pattern 5: Missing Test Evidence
  missing_test_evidence:
    name: "Test Evidence Not Captured"
    symptoms:
      - "Dev says it works, but no proof"
      - "UAT can't verify dev's claims"
    root_cause: "No test output in completion note"
    prevention:
      - "ralf-dev: Include test command and output in completion"
      - "ralf-uat: Require test evidence before accepting"
    frequency: 0
    last_seen: null

  # Pattern 6: Tooling Baseline Missing
  tooling_baseline_missing:
    name: "Tooling Baseline Missing"
    symptoms:
      - "Lint/build cannot run due to missing config"
      - "Dependency mismatch blocks verification"
    root_cause: "Repo baseline tooling not aligned (config/deps missing)"
    prevention:
      - "ralf-dev: Add tooling baseline checklist before running tests"
      - "ralf-sm: Keep build-stabilization task current"
    example:
      bad: "Run lint/build without ESLint config present"
      good: "Verify ESLint config + deps before running required tests"
    frequency: 1
    last_seen: 2026-02-04

  # Pattern 7: Build-Blocking Pre-Existing / Branch Divergence
  build_blocking_pre_existing:
    name: "Build-Blocking Pre-Existing or Branch Divergence"
    symptoms:
      - "Build fails on files not touched by task (lib/auth, formatFileSize)"
      - "Dep scan or type errors from code outside task scope"
      - "Worktree missing files that exist on main/story branch"
    root_cause: "Branch divergence; pre-existing dead code or deprecated imports; external dep API drift"
    prevention:
      - "ralf-dev: Run npm run build after first implementation pass"
      - "Merge master into story branch early when master has parallel changes (EPIC-5-WORKFLOW-GUIDE)"
      - "ralf-dev: Document build fixes in completion as 'scope expansion: unblock verification'"
    example:
      bad: "Complete task, run build at end, discover lib/auth missing"
      good: "Run build after FormBuilderCanvas refactor; catch lib/auth before completion"
    frequency: 1
    last_seen: 2026-02-11

  # Pattern 8: Preview Query Params Lost
  preview_query_params_lost:
    name: "Preview Query Params Lost"
    symptoms:
      - "Preview URL tests fail while direct public URL works"
      - "Kiosk mode does not activate in preview"
    root_cause: "Preview shell did not forward query params to embed/public links"
    prevention:
      - "ralf-dev: Add unit test for preview URL param passthrough"
      - "ralf-uat: Verify preview link preserves params before AC testing"
      - "ralf-sm: Include preview passthrough verification in task ACs that use preview links"
    example:
      bad: "Preview URL drops kiosk params so countdown never appears"
      good: "Preview URL passes `location.search` to iframe and public link"
    frequency: 1
    last_seen: 2026-02-04

prevention_action_patterns:

  # Proven prevention actions from past retros
  actions:
    - id: "PA-001"
      action: "Add 'Verification:' line to each AC in Task Spec"
      applies_to: "ambiguous_ac"
      effectiveness: "high"
      
    - id: "PA-002"
      action: "Run full test suite before marking dev complete"
      applies_to: "integration_assumption"
      effectiveness: "high"
      
    - id: "PA-003"
      action: "Always run *scope-check before classifying UAT failure as defect"
      applies_to: "uat_scope_creep"
      effectiveness: "high"

# Template for new patterns
template:
  name: ""
  symptoms: []
  root_cause: ""
  prevention: []
  example:
    bad: ""
    good: ""
  frequency: 0
  last_seen: null
