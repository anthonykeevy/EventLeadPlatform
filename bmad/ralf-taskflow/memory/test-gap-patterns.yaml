# Test Gap Patterns - Ralf Taskflow Memory
# Common missing tests and where to add them
# Updated from retrospective findings
# Version: 1.0.0
# Last Updated: 2026-01-11

test_gaps:

  # Gap 1: Form Validation Tests
  form_validation:
    name: "Missing Form Validation Tests"
    gap_description: "Form accepts invalid input, validation not tested"
    symptoms:
      - "UAT fails on invalid input"
      - "Error messages not shown"
    test_to_add:
      type: "unit"
      location: "src/features/{feature}/components/__tests__/"
      template: |
        describe('Form validation', () => {
          it('shows error for empty required field', () => {
            render(<Form />);
            fireEvent.click(screen.getByRole('button', { name: /submit/i }));
            expect(screen.getByText(/required/i)).toBeInTheDocument();
          });
          
          it('shows error for invalid format', () => {
            render(<Form />);
            fireEvent.change(screen.getByLabelText(/email/i), { target: { value: 'invalid' } });
            expect(screen.getByText(/valid email/i)).toBeInTheDocument();
          });
        });
      command: "npm test -- --testPathPattern=form"
    priority: "high"
    frequency: 0

  # Gap 2: API Error Handling Tests
  api_error_handling:
    name: "Missing API Error Handling Tests"
    gap_description: "API errors not handled gracefully"
    symptoms:
      - "App crashes on API failure"
      - "No error message shown to user"
    test_to_add:
      type: "unit"
      location: "src/features/{feature}/api/__tests__/"
      template: |
        describe('API error handling', () => {
          it('shows error message on 400 response', async () => {
            server.use(
              rest.post('/api/endpoint', (req, res, ctx) => {
                return res(ctx.status(400), ctx.json({ message: 'Bad request' }));
              })
            );
            // ... test error handling
          });
          
          it('shows error message on 500 response', async () => {
            // ... test server error handling
          });
        });
      command: "npm test -- --testPathPattern=api"
    priority: "high"
    frequency: 0

  # Gap 3: Auth Boundary Tests
  auth_boundary:
    name: "Missing Auth Boundary Tests"
    gap_description: "Protected routes/endpoints not tested for auth"
    symptoms:
      - "Unauthorized user can access protected resource"
      - "Auth token not validated"
    test_to_add:
      type: "integration"
      location: "src/features/auth/__tests__/"
      template: |
        describe('Auth boundaries', () => {
          it('redirects to login when not authenticated', async () => {
            render(<ProtectedPage />);
            expect(screen.getByText(/login/i)).toBeInTheDocument();
          });
          
          it('returns 401 when no auth token', async () => {
            const response = await fetch('/api/protected');
            expect(response.status).toBe(401);
          });
        });
      command: "npm test -- --testPathPattern=auth"
    priority: "high"
    frequency: 0

  # Gap 4: State Persistence Tests
  state_persistence:
    name: "Missing State Persistence Tests"
    gap_description: "Changes lost on refresh/navigation"
    symptoms:
      - "Data disappears after refresh"
      - "Form data lost on navigation"
    test_to_add:
      type: "e2e"
      location: "e2e/features/"
      template: |
        test('data persists after refresh', async ({ page }) => {
          await page.fill('#input', 'test value');
          await page.click('#save');
          await page.reload();
          expect(await page.inputValue('#input')).toBe('test value');
        });
      command: "npm run test:e2e"
    priority: "medium"
    frequency: 0

  # Gap 5: Loading State Tests
  loading_state:
    name: "Missing Loading State Tests"
    gap_description: "Loading indicators not shown"
    symptoms:
      - "No feedback during slow operations"
      - "User clicks multiple times"
    test_to_add:
      type: "unit"
      location: "src/features/{feature}/components/__tests__/"
      template: |
        describe('Loading states', () => {
          it('shows loading indicator during submit', async () => {
            render(<Form />);
            fireEvent.click(screen.getByRole('button', { name: /submit/i }));
            expect(screen.getByRole('progressbar')).toBeInTheDocument();
          });
          
          it('disables submit button while loading', async () => {
            // ... test button disabled state
          });
        });
      command: "npm test -- --testPathPattern=loading"
    priority: "medium"
    frequency: 0

  # Gap 6: Outbox Retry/Backoff Tests
  outbox_retry_backoff:
    name: "Missing Outbox Retry/Backoff Tests"
    gap_description: "Outbox retry/backoff behavior verified manually, not automated"
    symptoms:
      - "Manual DevTools checks needed for retry timing"
      - "Headers checked by hand to confirm auth-free behavior"
    test_to_add:
      type: "integration"
      location: "src/features/renderer/outbox/__tests__/"
      template: |
        describe('public outbox processor', () => {
          it('applies backoff and updates retry metadata', async () => {
            // mock fetch + indexedDB, assert status and retryCount
          });
        });
      command: "npm test -- --testPathPattern=publicOutbox"
    priority: "medium"
    frequency: 1

  # Gap 7: Resolver/URL Contract Tests
  resolver_contract:
    name: "Missing Resolver URL Contract Test"
    gap_description: "Resolver output format not verified against backend contract"
    symptoms:
      - "Builder and renderer might diverge on URL format"
      - "Backend contract change not caught"
    test_to_add:
      type: "unit"
      location: "frontend/src/features/builder/utils/__tests__/"
      template: |
        describe('backgroundAssetResolver', () => {
          it('resolveAssetContentUrl returns {base}/api/assets/{id}/content', () => {
            expect(resolveAssetContentUrl(1)).toMatch(/\/api\/assets\/1\/content$/);
          });
        });
      command: "npm test -- --testPathPattern=backgroundAssetResolver"
    priority: "medium"
    frequency: 1

  # Gap 8: Logic Engine Value Extraction
  logic_engine_value_extraction:
    name: "Missing Logic Engine Compound Value Tests"
    gap_description: "evaluateRules compares rule values against raw component payloads; radio/dropdown emit {value, extraTextByValue}"
    symptoms:
      - "Logic rules (show/hide, require/unrequire) don't apply for radio/dropdown in Preview"
      - "Rule 'equals yes' fails when value is {value:'yes', extraTextByValue:{}}"
    test_to_add:
      type: "unit"
      location: "frontend/src/features/logic-engine/__tests__/evaluateRules.test.ts"
      template: |
        describe('evaluateRules compound values', () => {
          it('extracts value from {value, extraTextByValue} for equals', () => {
            const result = evaluateRules({
              rules: [{ when: { sourceComponentId: 'r1', operator: 'equals', value: 'yes' }, then: { targetComponentId: 'e1', action: 'require' } }],
              valuesByComponentId: { r1: { value: 'yes', extraTextByValue: {} } },
              componentsById: { r1: {}, e1: {} },
              baseStateById: { e1: { visible: true, enabled: true, required: false } }
            });
            expect(result.stateById.e1?.required).toBe(true);
          });
          
          it('extracts values from {values} for checkbox-with-options contains', () => {
            // ...
          });
        });
      command: "npm test -- --testPathPattern=evaluateRules"
    priority: "medium"
    frequency: 1

  # Gap 9: Preview URL Param Passthrough
  preview_url_params:
    name: "Missing Preview URL Param Passthrough Test"
    gap_description: "Preview shell does not verify query params are forwarded to embed/public URLs"
    symptoms:
      - "Preview link drops kiosk params"
      - "Countdown/reset never triggers in preview"
    test_to_add:
      type: "unit"
      location: "frontend/src/features/renderer/pages/__tests__/"
      template: |
        describe('PublicFormPreviewShellPage', () => {
          it('passes location.search params to embed and public URLs', () => {
            // render with ?kiosk=1&autoResetSeconds=10
            // assert iframe src and link href include params
          });
        });
      command: "npm test -- --testPathPattern=PublicFormPreviewShellPage"
    priority: "medium"
    frequency: 1

# When to add each test type
test_type_guidance:
  unit:
    when: "Testing isolated component/function behavior"
    location: "Same directory as source, in __tests__/"
    speed: "Fast (< 1s)"
    
  integration:
    when: "Testing components working together"
    location: "src/__tests__/integration/"
    speed: "Medium (1-10s)"
    
  e2e:
    when: "Testing full user flows"
    location: "e2e/"
    speed: "Slow (10s+)"

# Template for new test gaps
template:
  name: ""
  gap_description: ""
  symptoms: []
  test_to_add:
    type: ""
    location: ""
    template: ""
    command: ""
  priority: ""
  frequency: 0
