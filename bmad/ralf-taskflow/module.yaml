# Ralf Taskflow Module Manifest
# BMAD v6 Module Definition
code: ralf-taskflow
name: "Ralf Taskflow"
header: "Ralf Taskflow Module"
subheader: "Complete task lifecycle: decompose, execute, validate, learn"
default_selected: false
type: module
version: "1.6.0"
author: "Anthony Keevy"
created: "2026-01-11"
updated: "2026-01-14"
bmad_version_required: "6.0.0"

# Module metadata
description: "Complete agile task lifecycle module - decomposes stories into tasks, executes with verification, validates with human UAT, and extracts lessons for continuous improvement"
category: "agile-workflow"
tags:
  - task-decomposition
  - task-execution
  - uat
  - retrospective
  - continuous-improvement
  - scrum
  - agile
  - testing
  - scope-management

# Variables from Core Config inherited
# user_name
# communication_language
# document_output_language
# output_folder

# Module components
agents:
  - id: ralf-sm
    name: "Ralf"
    title: "Scrum Master + Task Decomposer"
    path: "agents/ralf-sm/ralf-sm.agent.yaml"
    description: "Decomposes stories into small, testable tasks"
    
  - id: ralf-dev
    name: "Ralf-Dev"
    title: "Task Executor"
    path: "agents/ralf-dev/ralf-dev.agent.yaml"
    description: "Executes one task per session with strict scope enforcement"
    
  - id: ralf-uat
    name: "Ralf-UAT"
    title: "Human UAT Gatekeeper"
    path: "agents/ralf-uat/ralf-uat.agent.yaml"
    description: "Generates UAT checklists and records human test results (v1.5: auto-completes docs on pass)"
    
  - id: ralf-retro
    name: "Ralf-Retro"
    title: "Retrospective + Memory Curator"
    path: "agents/ralf-retro/ralf-retro.agent.yaml"
    description: "Extracts lessons and test improvements from completed tasks"

workflows:
  # ralf-sm workflows
  - id: decompose-story
    name: "Decompose Story"
    path: "workflows/decompose-story/workflow.yaml"
    agent: ralf-sm
  - id: next-task
    name: "Next Task"
    path: "workflows/next-task/workflow.yaml"
    agent: ralf-sm
    description: "Review completed task and prepare next task from TASK-PLAN"
  - id: refine-task
    name: "Refine Task"
    path: "workflows/refine-task/workflow.yaml"
    agent: ralf-sm
    
  # ralf-dev workflows
  - id: run-task
    name: "Run Task"
    path: "workflows/run-task/workflow.yaml"
    agent: ralf-dev
  - id: dev-scope-check
    name: "Dev Scope Check"
    path: "workflows/scope-check/workflow.yaml"
    agent: ralf-dev
  - id: dev-prepare-uat
    name: "Dev Prepare UAT"
    path: "workflows/prepare-uat/workflow.yaml"
    agent: ralf-dev
  - id: dev-handoff
    name: "Dev Handoff"
    path: "workflows/handoff/workflow.yaml"
    agent: ralf-dev
    
  # ralf-uat workflows
  - id: uat-generate
    name: "Generate UAT Checklist"
    path: "workflows/uat-generate/workflow.yaml"
    agent: ralf-uat
  - id: uat-record
    name: "Record UAT Results"
    path: "workflows/uat-record/workflow.yaml"
    agent: ralf-uat
  - id: uat-scope-check
    name: "UAT Scope Check"
    path: "workflows/uat-scope-check/workflow.yaml"
    agent: ralf-uat
  - id: uat-handoff
    name: "UAT Handoff"
    path: "workflows/uat-handoff/workflow.yaml"
    agent: ralf-uat
    
  # ralf-retro workflows
  - id: retro-run
    name: "Run Retrospective"
    path: "workflows/retro-run/workflow.yaml"
    agent: ralf-retro
  - id: retro-testing-playbook
    name: "Update Testing Playbook"
    path: "workflows/retro-testing-playbook/workflow.yaml"
    agent: ralf-retro
  - id: retro-spec-improvement
    name: "Spec Improvement"
    path: "workflows/retro-spec-improvement/workflow.yaml"
    agent: ralf-retro
  - id: retro-route-item
    name: "Route Backlog Item"
    path: "workflows/retro-route-item/workflow.yaml"
    agent: ralf-retro

memory:
  # Shared memory (ralf-sm focused)
  - id: decomposition-patterns
    name: "Decomposition Patterns"
    path: "memory/decomposition-patterns.yaml"
    used_by: ralf-sm
  - id: failure-patterns
    name: "Failure Patterns"
    path: "memory/failure-patterns.yaml"
    used_by: ralf-sm
  - id: high-leverage-tests
    name: "High-Leverage Tests"
    path: "memory/high-leverage-tests.yaml"
    used_by: [ralf-sm, ralf-dev, ralf-uat, ralf-retro]
    
  # ralf-dev focused memory
  - id: dev-patterns
    name: "Dev Patterns"
    path: "memory/dev-patterns.yaml"
    used_by: ralf-dev
  - id: common-failures
    name: "Common Failures"
    path: "memory/common-failures.yaml"
    used_by: ralf-dev
  - id: test-shortcuts
    name: "Test Shortcuts"
    path: "memory/test-shortcuts.yaml"
    used_by: ralf-dev
    
  # ralf-uat focused memory
  - id: uat-failure-patterns
    name: "UAT Failure Patterns"
    path: "memory/uat-failure-patterns.yaml"
    used_by: ralf-uat
  - id: uat-checklist-patterns
    name: "UAT Checklist Patterns"
    path: "memory/uat-checklist-patterns.yaml"
    used_by: ralf-uat
  - id: automation-opportunities
    name: "Automation Opportunities"
    path: "memory/automation-opportunities.yaml"
    used_by: [ralf-uat, ralf-dev, ralf-retro]
    
  # ralf-retro focused memory
  - id: retro-patterns
    name: "Retro Patterns"
    path: "memory/retro-patterns.yaml"
    used_by: ralf-retro
  - id: test-gap-patterns
    name: "Test Gap Patterns"
    path: "memory/test-gap-patterns.yaml"
    used_by: [ralf-retro, ralf-dev]
  - id: process-improvements
    name: "Process Improvements"
    path: "memory/process-improvements.yaml"
    used_by: [ralf-retro, ralf-sm, ralf-dev, ralf-uat]

# Output paths
outputs:
  task_plans: "{project-root}/docs/tasks/{story-id}/TASK-PLAN.md"
  task_specs: "{project-root}/docs/tasks/{story-id}/T{nn}-{slug}.md"
  completion_notes: "{project-root}/docs/tasks/{story-id}/T{nn}-{slug}.completion.md"
  qa_notes: "{project-root}/docs/tasks/{story-id}/T{nn}-{slug}.qa-notes.md"
  uat_checklists: "{project-root}/docs/tasks/{story-id}/T{nn}-{slug}.uat.md"
  uat_results: "{project-root}/docs/tasks/{story-id}/T{nn}-{slug}.uat-results.md"
  retro_summaries: "{project-root}/docs/tasks/{story-id}/T{nn}-{slug}.retro.md"
  lessons_learned: "{project-root}/docs/tasks/{story-id}/LESSONS-LEARNED.md"
  backlog_items: "{project-root}/docs/tasks/{story-id}/BACKLOG-ITEMS.md"
  testing_playbook: "{project-root}/docs/learning/testing-playbook.md"
  status: "{project-root}/docs/tasks/{story-id}/STATUS.md"