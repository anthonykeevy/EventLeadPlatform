# Next Task Workflow
# BMAD v6 Workflow for Ralf Taskflow Module
name: next-task
description: "Review completed task, update status, and prepare next task spec from TASK-PLAN"
author: "Ralf Taskflow Module"
version: "1.0.0"

# Critical variables from config
config_source: "{project-root}/bmad/ralf-taskflow/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
date: system-generated

# Workflow components
installed_path: "{project-root}/bmad/ralf-taskflow/workflows/next-task"
instructions: "{installed_path}/instructions.md"
validation: "{installed_path}/checklist.md"
template: false

# Variables and inputs
variables:
  story_id: ""
  completed_task_id: ""
  task_plan_path: "{output_folder}/{story_id}/TASK-PLAN.md"
  lessons_learned_path: "{output_folder}/{story_id}/LESSONS-LEARNED.md"

# Output files
outputs:
  next_task_spec: "{output_folder}/{story_id}/T{nn}-{slug}.md"
  updated_task_plan: "{output_folder}/{story_id}/TASK-PLAN.md"
  status: "{output_folder}/{story_id}/STATUS.md"

required_tools:
  - read_file
  - write_file
  - list_files

recommended_inputs:
  - task_plan: "TASK-PLAN.md file"
  - completed_retro: "Previous task retro file"
  - story_file: "Original story file"

tags:
  - task-progression
  - planning
  - bmad-v6

execution_hints:
  interactive: true
  autonomous: false
  iterative: true

standalone: true
