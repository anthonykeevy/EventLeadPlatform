# Route Item Workflow
# BMAD v6 Workflow for Ralf Taskflow Module
name: retro-route-item
description: "Route scope creep, new features, and defects to appropriate backlog"
author: "Ralf Taskflow Module"
version: "1.0.0"

# Critical variables from config
config_source: "{project-root}/bmad/ralf-taskflow/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"

# Workflow components
installed_path: "{project-root}/bmad/ralf-taskflow/workflows/retro-route-item"
instructions: "{installed_path}/instructions.md"
validation: "{installed_path}/checklist.md"
template: false

# Variables and inputs
variables:
  story_id: ""
  item_description: ""
  item_source: ""

# Output files
outputs:
  backlog_items: "{output_folder}/{story_id}/BACKLOG-ITEMS.md"

required_tools:
  - read_file
  - write_file

tags:
  - routing
  - backlog
  - scope-creep
  - bmad-v6

execution_hints:
  interactive: true
  autonomous: false

standalone: true
