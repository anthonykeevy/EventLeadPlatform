# Retro Run Workflow
# BMAD v6 Workflow for Ralf Taskflow Module
name: retro-run
description: "Run full retrospective on a completed task, extract lessons, update memory"
author: "Ralf Taskflow Module"
version: "1.0.0"

# Critical variables from config
config_source: "{project-root}/bmad/ralf-taskflow/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
date: system-generated

# Workflow components
installed_path: "{project-root}/bmad/ralf-taskflow/workflows/retro-run"
instructions: "{installed_path}/instructions.md"
validation: "{installed_path}/checklist.md"
template: false

# Variables and inputs
variables:
  story_id: ""
  task_id: ""
  task_spec_path: ""
  completion_note_path: ""
  uat_checklist_path: ""
  uat_results_path: ""

# Output files
outputs:
  retro_summary: "{output_folder}/{story_id}/{task_id}.retro.md"
  lessons_learned: "{output_folder}/{story_id}/LESSONS-LEARNED.md"

required_tools:
  - read_file
  - write_file

recommended_inputs:
  - task_spec: "Task Spec markdown file"
  - completion_note: "Task Completion Note from ralf-dev"
  - uat_checklist: "UAT Checklist from ralf-uat"
  - uat_results: "UAT Results from ralf-uat"
  - transcript: "Optional session transcript"
  - test_logs: "Optional test output logs"

tags:
  - retrospective
  - learning
  - continuous-improvement
  - bmad-v6

execution_hints:
  interactive: true
  autonomous: false

standalone: true
