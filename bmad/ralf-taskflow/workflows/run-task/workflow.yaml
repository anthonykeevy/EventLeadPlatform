# Run Task Workflow
# BMAD v6 Workflow for Ralf Taskflow Module
name: run-task
description: "Execute a single task from a Task Spec file with full verification and completion note"
author: "Ralf Taskflow Module"
version: "1.0.0"

# Critical variables from config
config_source: "{project-root}/bmad/ralf-taskflow/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
date: system-generated

# Workflow components
installed_path: "{project-root}/bmad/ralf-taskflow/workflows/run-task"
instructions: "{installed_path}/instructions.md"
validation: "{installed_path}/checklist.md"
template: false

# Variables and inputs
variables:
  task_spec_path: ""
  story_id: ""
  task_id: ""

# Output files
outputs:
  completion_note: "{output_folder}/{story_id}/{task_id}.completion.md"
  qa_notes: "{output_folder}/{story_id}/{task_id}.qa-notes.md"
  lessons_update: "{output_folder}/{story_id}/LESSONS-LEARNED.md"

required_tools:
  - read_file
  - write_file
  - list_files
  - search_files
  - run_terminal_command

recommended_inputs:
  - task_spec: "Task Spec markdown file"
  - prd: "PRD document (optional)"
  - architecture: "Solution architecture (optional)"

tags:
  - task-execution
  - implementation
  - bmad-v6

execution_hints:
  interactive: true
  autonomous: false
  iterative: true

standalone: true
