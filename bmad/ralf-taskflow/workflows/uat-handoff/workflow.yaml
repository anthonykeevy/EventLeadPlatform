# UAT Handoff Workflow
# BMAD v6 Workflow for Ralf Taskflow Module
name: uat-handoff
description: "Complete UAT and handoff to next agent (ralf-retro or ralf-dev)"
author: "Ralf Taskflow Module"
version: "1.0.0"

# Critical variables from config
config_source: "{project-root}/bmad/ralf-taskflow/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"

# Workflow components
installed_path: "{project-root}/bmad/ralf-taskflow/workflows/uat-handoff"
instructions: "{installed_path}/instructions.md"
validation: "{installed_path}/checklist.md"
template: false

# Variables and inputs
variables:
  story_id: ""
  task_id: ""
  uat_result: ""

# Output
outputs:
  handoff_summary: "console output with next steps"

required_tools:
  - read_file
  - write_file

tags:
  - handoff
  - uat
  - bmad-v6

execution_hints:
  interactive: true
  autonomous: false

standalone: true
