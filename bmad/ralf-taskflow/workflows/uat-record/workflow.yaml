# UAT Record Workflow
# BMAD v6 Workflow for Ralf Taskflow Module
name: uat-record
description: "Record human UAT results and update task status"
author: "Ralf Taskflow Module"
version: "1.0.0"

# Critical variables from config
config_source: "{project-root}/bmad/ralf-taskflow/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
date: system-generated

# Workflow components
installed_path: "{project-root}/bmad/ralf-taskflow/workflows/uat-record"
instructions: "{installed_path}/instructions.md"
validation: "{installed_path}/checklist.md"
template: false

# Variables and inputs
variables:
  story_id: ""
  task_id: ""
  tester_name: ""
  results: []

# Output files
outputs:
  uat_results: "{output_folder}/{story_id}/{task_id}.uat-results.md"
  status_update: "{output_folder}/{story_id}/TASK-PLAN.md"

required_tools:
  - read_file
  - write_file

tags:
  - uat
  - results
  - validation
  - bmad-v6

execution_hints:
  interactive: true
  autonomous: false

standalone: true
